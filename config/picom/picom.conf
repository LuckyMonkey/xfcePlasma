backend = "glx";
vsync = true;
use-damage = true;
# Let fullscreen games present directly. Picom automatically resumes
# compositing when the fullscreen window closes or is minimized.
unredir-if-possible = true;
unredir-if-possible-delay = 0;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;

# Picom supplies shadows while XFWM continues to manage windows.
shadow = false;
shadow-radius = 12;
shadow-opacity = 0.45;
shadow-offset-x = -8;
shadow-offset-y = -8;
corner-radius = 0;

rules = (
  { match = "window_type = 'desktop' || window_type = 'dock'"; shadow = false; corner-radius = 0; },
  { match = "class_g = 'Xfce-edge-center'"; opacity = 0.94; shadow = true; corner-radius = 10; },
  { match = "class_g = 'firefox_firefox' || class_g = 'TelegramDesktop'"; shadow = false; }
);

# Native Picom v13 animation presets. XFWM remains the window manager.
animations = (
  {
    triggers = [ "open", "show" ];
    preset = "appear";
    scale = 0.96;
    duration = 0.16;
  },
  {
    triggers = [ "close", "hide" ];
    preset = "disappear";
    scale = 0.96;
    duration = 0.14;
  }
);
